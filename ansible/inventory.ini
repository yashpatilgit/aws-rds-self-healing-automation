#i-REPLACE_WITH_INSTANCE_ID: your EC2 instance ID.
#REPLACE_WITH_STATE_BUCKET_NAME: your existing Terraform state S3 bucket name.

[rds_automation]
rds_runner ansible_host=i-REPLACE_WITH_INSTANCE_ID

[rds_automation:vars]
ansible_connection=amazon.aws.aws_ssm
ansible_aws_ssm_region=ap-south-1
ansible_aws_ssm_bucket_name=REPLACE_WITH_STATE_BUCKET_NAME
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3